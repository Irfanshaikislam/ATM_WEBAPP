<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/login.css">
    <title>Login</title>
</head>
<body>
    <div class="login-container">
        <form method="POST" action="">
            <h3 class="Heading">Login into Account</h3>
            <label for="name">User Name:</label>
            <input type="text" name="username" id="name" placeholder="Enter User Name"><br/><br/>
            <label for="Password">User Password:</label>
            <input type="password" name="userpassword" id="Password" placeholder="Enter User Password"><br/><br/>
            <label for="pin">Pin No:</label>
            <input type="text" name="pinNumber" id="pin" placeholder="Enter the Pin Number"><br/><br/>
            <div class="button-container">
                <a href=""><button type="submit">Submit</button></a>
            </div>
        </form>
    </div>
</body>
</html>
