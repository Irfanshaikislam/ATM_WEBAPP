<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../static/statements.css">
  <title>Transaction Statement</title>
</head>
<body>
  <h2>Deposit Statements</h2>
  <table>
    <thead>
      <tr>
        <th>Deposit Amount</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="deposit">$500.00</td>
        <td>2025-10-24 10:30 AM</td>
      </tr>
      <tr>
        <td class="deposit">$200.00</td>
        <td>2025-10-22 3:45 PM</td>
      </tr>
    </tbody>
  </table>

  <h2>Withdraw Statements</h2>
  <table>
    <thead>
      <tr>
        <th>Withdraw Amount</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="withdraw">$100.00</td>
        <td>2025-10-23 1:15 PM</td>
      </tr>
      <tr>
        <td class="withdraw">$50.00</td>
        <td>2025-10-21 5:20 PM</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
